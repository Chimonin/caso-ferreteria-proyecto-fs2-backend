spring.application.name=ms-pagos
server.port=8084

# Cada microservicio tiene su PROPIA base de datos: ferreteria_pagos
# DB_URL la cambia docker-compose; si no existe, se usa tu MySQL local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferreteria_pagos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway crea las tablas con los archivos de db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA solo revisa que las entidades calcen con las tablas (no las crea)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Direccion de ms-usuarios, para revisar y descontar la deuda del cliente
servicios.usuarios.url=${USUARIOS_URL:http://localhost:8081}
