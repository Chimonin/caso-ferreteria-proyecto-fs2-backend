spring.application.name=ms-pedidos
server.port=8083

# Cada microservicio tiene su PROPIA base de datos: ferreteria_pedidos
# DB_URL la cambia docker-compose; si no existe, se usa tu MySQL local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferreteria_pedidos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway crea las tablas con los archivos de db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA solo revisa que las entidades calcen con las tablas (no las crea)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Direcciones de los otros microservicios a los que pedidos les pregunta cosas
# (en docker-compose se cambian por los nombres de los contenedores)
servicios.productos.url=${PRODUCTOS_URL:http://localhost:8082}
servicios.usuarios.url=${USUARIOS_URL:http://localhost:8081}
