spring.application.name=Ferreteria_Los_Maestros

# Conexion a MySQL (la base se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria_los_maestros?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Flyway crea las tablas con los archivos de db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA solo revisa que las entidades calcen con las tablas (no las crea)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
