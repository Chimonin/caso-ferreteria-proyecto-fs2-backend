# Levanta todo el backend con un solo comando:
#   docker compose up --build
# La clave de MySQL se lee del archivo .env (copia .env.example y ponle tu clave)

x-db-comun: &db-comun
  DB_USER: root
  DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}

services:

  # un solo servidor MySQL, pero cada microservicio usa su PROPIA base de datos
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
    ports:
      # 3307 afuera para no chocar con el MySQL que tienes instalado en tu computador (3306)
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  ms-usuarios:
    build: ./ms-usuarios
    environment:
      <<: *db-comun
      DB_URL: jdbc:mysql://mysql:3306/ferreteria_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  ms-productos:
    build: ./ms-productos
    environment:
      <<: *db-comun
      DB_URL: jdbc:mysql://mysql:3306/ferreteria_productos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

  ms-pedidos:
    build: ./ms-pedidos
    environment:
      <<: *db-comun
      DB_URL: jdbc:mysql://mysql:3306/ferreteria_pedidos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
      # dentro de docker, cada servicio se llama por el nombre de su contenedor
      PRODUCTOS_URL: http://ms-productos:8082
      USUARIOS_URL: http://ms-usuarios:8081
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy

  ms-pagos:
    build: ./ms-pagos
    environment:
      <<: *db-comun
      DB_URL: jdbc:mysql://mysql:3306/ferreteria_pagos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
      USUARIOS_URL: http://ms-usuarios:8081
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy

  # unico punto de entrada para React: http://localhost:8080
  api-gateway:
    build: ./api-gateway
    environment:
      USUARIOS_URL: http://ms-usuarios:8081
      PRODUCTOS_URL: http://ms-productos:8082
      PEDIDOS_URL: http://ms-pedidos:8083
      PAGOS_URL: http://ms-pagos:8084
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - ms-usuarios
      - ms-productos
      - ms-pedidos
      - ms-pagos

volumes:
  mysql_data:
